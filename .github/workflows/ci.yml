name: 檢查與測試版建置

# 每次推送或開 PR：跑單元測試、lint，並打一個 debug 版 APK（不需要發布金鑰）。
#
# 正式版不在這裡打：正式版要用發布金鑰簽名，金鑰只留在維護者的電腦上，
# 由 tools/release.sh 在本機打包並發布到 GitHub Release（說明見 README「發布新版本」）。
on:
  push:
    branches: [main, "orange-*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 測試、lint、debug 建置
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools

      - name: 安裝 Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: 版本資訊
        run: |
          echo "$(tools/version.sh name) $(tools/version.sh version)（versionCode $(tools/version.sh code)）→ $(tools/version.sh apk)"

      - name: 單元測試、lint、debug 建置
        run: ./android/gradlew -p android :core:test :app:lintDebug :app:assembleDebug --console=plain

      - name: 上傳測試報告與 debug APK
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hgtv-orange-debug
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/core/build/reports/tests/
            android/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
